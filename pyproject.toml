[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permit-panic"
version = "0.1.0"
description = "Self-hosted watcher for backcountry permits and campsites on Recreation.gov"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "tomli-w>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
permit-panic = "permit_panic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
