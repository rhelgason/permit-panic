name: tests
# The server installs main directly (`panic update`), and refuses a commit whose tests failed here.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the droplet's Ubuntu 24.04 Python
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
